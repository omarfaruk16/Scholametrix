# /etc/nginx/sites-available/scholametrix.tech — the static website (out/). Main address:
# https://www.scholametrix.tech ; the bare domain redirects to it.
#
# Certificate first (DNS for both names must point here; Cloudflare proxy is fine):
#   mkdir -p /var/www/letsencrypt
#   certbot certonly --webroot -w /var/www/letsencrypt -d scholametrix.tech -d www.scholametrix.tech
# (the port-80 block below must already be enabled so the challenge can be answered)

server {
    listen 80;
    listen [::]:80;
    server_name scholametrix.tech www.scholametrix.tech;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.scholametrix.tech$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scholametrix.tech;
    ssl_certificate     /etc/letsencrypt/live/scholametrix.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scholametrix.tech/privkey.pem;
    return 301 https://www.scholametrix.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.scholametrix.tech;
    ssl_certificate     /etc/letsencrypt/live/scholametrix.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scholametrix.tech/privkey.pem;

    root /var/www/scholametrix/out;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /images/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Clean URLs: /about -> about.html. The old /ai-marking address goes to the new page.
    location = /ai-marking { return 301 /ai-evaluation; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
